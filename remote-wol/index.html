<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#101d30">
<title>تشغيل PC3 | NobleKey</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#edf6ff;background:#101d30;min-height:100vh;display:grid;place-items:center}
main{width:min(420px,94vw);background:#172b45;border:1px solid #35516c;border-radius:26px;padding:27px;text-align:center;box-shadow:0 14px 40px #0004}
h1{font-size:25px;margin:12px 0}p{line-height:1.85;color:#b6cee5}button{display:block;width:100%;border:0;border-radius:15px;margin:15px 0;padding:17px;font-size:21px;font-weight:800;color:#09233a;background:#53bbf3;cursor:pointer}button:disabled{opacity:.5}
input{display:block;margin:12px 0;width:100%;padding:14px;background:#0c1c30;border:1px solid #567a9a;color:white;border-radius:12px}
#status{padding:17px;border-radius:12px;background:#0d1e32;line-height:1.6;min-height:70px}
small{font-size:12px;color:#99b5d2}
</style></head><body><main><div style="font-size:48px">🖥️</div><h1>تشغيل PC3 عن بُعد</h1>
<p>شغّل الكمبيوتر من موبايلك حتى لو خارج الشبكة.</p>
<section id="setup"><input id="secret" type="password" placeholder="مفتاح التشغيل"><button id="save" type="button">حفظ المفتاح</button></section>
<button id="wake" type="button" disabled>تشغيل الكمبيوتر</button>
<div id="status">جاري التجهيز...</div>
<p><small>الزر يرسل Wake-on-LAN للراوتر، وإرسال النبضة وحده لا يثبت اكتمال تشغيل Windows.</small></p></main>
<script>
const status=document.getElementById('status'),btn=document.getElementById('wake'),setup=document.getElementById('setup');
let token=localStorage.getItem('noblekey_pc3_wake_token')||'';
if(location.hash.length>32){
 try{token=decodeURIComponent(location.hash.slice(1));localStorage.setItem('noblekey_pc3_wake_token',token);history.replaceState({},'',location.pathname);}catch(e){status.textContent='تعذر استيراد المفتاح';}
}
function refresh(){setup.hidden=!!token;btn.disabled=!token;status.textContent=token?'جاهز للإرسال':'أدخل مفتاح التشغيل مرة واحدة';}
document.getElementById('save').onclick=()=>{const s=document.getElementById('secret').value.trim();if(s.length<32){status.textContent='المفتاح غير صالح';return;}token=s;localStorage.setItem('noblekey_pc3_wake_token',s);refresh();};
async function api(p,o){const r=await fetch(p,{...o,cache:'no-store',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.error||'server_error');return j;}
btn.onclick=async()=>{btn.disabled=true;status.textContent='بنبعت طلب تشغيل الجهاز...';try{
 const j=await api('/api/wake',{method:'POST',body:'{}'});status.textContent='تم استلام الطلب، الراوتر هينفذه خلال دقيقة';
 for(let i=0;i<24;i++){await new Promise(r=>setTimeout(r,5000));let q=await api('/api/status?id='+encodeURIComponent(j.id));if(q.state==='sent'){status.textContent='الراوتر بعت نبضات الإيقاظ بنجاح! افتح الريموت علشان تتأكد إن الكمبيوتر قام.';break;}
 if(q.state==='failed'||q.state==='expired'){status.textContent='حصلت مشكلة في الإرسال، جرّب مرة تانية.';break;}
 if(i===23)status.textContent='الطلب لسه تحت المتابعة، افحص حالة الريموت.';}
}catch(e){status.textContent='مشكلة اتصال: '+e.message;}finally{btn.disabled=!token;}};
refresh();
</script></body></html>
